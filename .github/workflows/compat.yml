name: Compat

# Early warning: run the full suite against the newest Prisma and Zod releases,
# without waiting for a Dependabot PR. Prisma changes error `meta` shapes in minors.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm install --no-save prisma@latest @prisma/client@latest @prisma/adapter-pg@latest zod@latest
      - run: npm ls prisma @prisma/client @prisma/adapter-pg zod
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
